[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "gymnasium>=1.0",
  "pettingzoo>=1.26",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = ["torch>=2.4"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2.10"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
